# Every `uses:` in .github/workflows is pinned to a commit SHA with its release tag in a comment; Dependabot opens a
# weekly PR that moves the SHA and the comment together when an action publishes a new release; and the website's npm
# packages.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # The website's dependencies (website/package.json: Astro, Starlight and its plugins): one weekly PR, everything
  # moved together (Astro and Starlight are released in step).
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      website:
        patterns: ["*"]
