# Every `uses:` in .github/workflows is pinned to a commit SHA with its release tag in a comment; Dependabot opens a
# weekly PR that moves the SHA and the comment together when an action publishes a new release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
