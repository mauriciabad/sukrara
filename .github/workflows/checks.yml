# The repo's guards (CLAUDE.md → tools/check) plus every app's builds and tests over the shared contracts/.
# The trigger is never path-filtered (a skipped workflow leaves a required check pending forever): the `changes` job
# decides which jobs run (tools/ci/changes.py: what changed since the newest commit with a green run; nothing for a
# commit that already has one, e.g. main fast-forwarded to next's), and `gate` is the ONLY required check: it fails
# unless every job that should have run passed.
name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run every job, whatever changed
        type: boolean
        default: false
permissions:
  contents: read
# A pull request's newer push cancels its older run. Pushes never wait for or cancel each other: every pushed commit
# gets its own run at once (the release waits for its version commit's run, which must neither queue behind the run
# before it nor be cancelled by the one after); a later commit's run covers what an unfinished one changed (changes.py).
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      rules: ${{ steps.plan.outputs.rules }}
      android: ${{ steps.plan.outputs.android }}
      mac: ${{ steps.plan.outputs.mac }}
      range: ${{ steps.plan.outputs.range }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: What changed since the newest green commit
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FULL: ${{ inputs.full }}
        run: python3 tools/ci/changes.py >> "$GITHUB_OUTPUT"

  rules:
    needs: changes
    if: needs.changes.outputs.rules == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: tools/check/run.sh since the newest green commit (a PR's base)
        env:
          RANGE: ${{ needs.changes.outputs.range }}
        run: |
          echo "range: $RANGE"
          tools/check/run.sh --range "$RANGE"
      - name: The checks' own tests
        run: tools/check/run.sh --selftest
      - name: Which jobs a run needs (tools/ci/changes.py)
        run: python3 tools/ci/test_changes.py
      - name: Generated settings code is up to date
        run: python3 tools/settings/gen.py --check
      - name: The local test relay's tests (loopback only)
        run: python3 tools/relay/test_relay.py
      - name: The release command's tests (CHANGELOG, notes, version, store request bodies; no network, no keys)
        run: python3 tools/release/test_release.py
      # The independent Python reference (poc/spec/reference, frozen) with PROTOCOL-v2's rules: every sync sequence
      # gives the same verdicts and state as both apps, and the OGS vectors are its generator's bytes.
      - name: Protocol fixtures cross-checked against the reference follower
        run: python3 tools/protocol/sync_crosscheck.py
      - name: Scripts parse
        run: for f in tools/*.sh tools/*/*.sh; do bash -n "$f" || exit 1; done

  # `./gradlew check` runs as two jobs side by side: `android` is all of it but Android Lint (`check -x lint`: unit +
  # contract tests, spotlessCheck) plus Roborazzi verify, `android-lint` is `lint`; together exactly `check`'s tasks.
  # `android-release` and `android-play` build the release outputs meanwhile. Each starts from .github/actions/gradle
  # (Gradle's build cache from the newest run: only what a change touches runs again).
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/gradle
        with:
          cache: android-test
      - name: ./gradlew check -x lint (unit + contract tests, spotless) + Roborazzi verify
        working-directory: apps/android
        # No -x verifyReleaseSigning: `check` builds no release output (the release unit tests are off), so it must pass
        # without the owner's key; the guard on preReleaseBuild only stops real release builds.
        # Roborazzi verify only where goldens are committed (src/test/snapshots): :core:graph, :widgets, :monitor, :pen. They are
        # recorded on this same runner image by goldens.yml (Mac renders differ in text antialiasing and blending).
        # `check` includes spotlessCheck (ktlint + Compose rules + GPL header; QualityConventionPlugin).
        run: >-
          ./gradlew --no-daemon check -x lint
          :core:graph:verifyRoborazziDebug :widgets:verifyRoborazziDebug :monitor:verifyRoborazziDebug :pen:verifyRoborazziDebug
      # :feature:sharing's other screenshot tests are review galleries, never goldens: only the Share with someone goldens
      # (#170, its dark theme) are verified, by filtering the test task.
      - name: Roborazzi verify (Share with someone)
        working-directory: apps/android
        run: >-
          ./gradlew --no-daemon :feature:sharing:testDebugUnitTest --tests '*ShareScreenGoldenTest'
          -Proborazzi.test.verify=true
      # :feature:treatments likewise: only the Add treatment dialog's goldens (#181: the PoC's look, the lock-screen version)
      - name: Roborazzi verify (Add treatment dialog)
        working-directory: apps/android
        run: >-
          ./gradlew --no-daemon :feature:treatments:testDebugUnitTest --tests '*TreatmentDialogGoldenTest'
          -Proborazzi.test.verify=true
      # Room exports each schema version while compiling; one the build changed but nobody committed would ship a
      # database that old installs can't open (tools/check room-schema keeps committed versions unchanged).
      - name: Room schemas the build exported are committed
        run: |
          git diff --exit-code -- 'apps/android/*/schemas' ||
            { echo "::error::Room schema changed by the build: bump @Database version, commit the new schema, add a migration"; exit 1; }
          test -z "$(git ls-files --others --exclude-standard -- 'apps/android/*/schemas')" ||
            { echo "::error::a new Room schema the build exported isn't committed"; exit 1; }
      - name: Roborazzi diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roborazzi-diffs
          path: apps/android/**/build/outputs/roborazzi
          if-no-files-found: ignore

  android-lint:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/gradle
        with:
          cache: android-lint
      - name: ./gradlew lint (check's Android Lint; errors and the curated warnings fail, QualityConventionPlugin)
        working-directory: apps/android
        run: ./gradlew --no-daemon lint

  android-release:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/gradle
        with:
          cache: android-release
      # The alert sounds are looked up by name, so only keep_alert_sounds.xml stops resource shrinking from removing
      # them (a silent alarm on release builds only). An unsigned release build is shrunk exactly like the signed one.
      - name: Alert sounds survive release resource shrinking
        working-directory: apps/android
        run: |
          # no Libre 3 core on CI (a separate checkout): skip its checks, the sounds are what this step verifies
          ./gradlew --no-daemon :app:assembleFullRelease -x verifyReleaseSigning -x verifyJuggluco -x verifyFullReleaseApkNativeCore
          ../../tools/release/verify-sounds.sh app/build/outputs/apk/full/release/app-full-release-unsigned.apk

  # The Google Play build (play flavor): the bundle builds and passes every check play-bundle.sh makes before an
  # upload except the signer and the Libre 3 core (no release key, no Juggluco checkout on CI): bundletool validate,
  # its universal APK through verify-apk.sh --play (permissions with play_permissions; the System UI module; no
  # update-check code).
  android-play:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/gradle
        with:
          cache: android-play
      - name: Play bundle, unsigned, checked
        run: tools/release/play-bundle.sh --unsigned

  mac:
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    # apps/macos builds against the macOS 27 SDK: the runner with Xcode 27.1, selected explicitly.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: swift format lint --strict (apps/macos/.swift-format)
        working-directory: apps/macos
        run: swift format lint --strict --recursive Sources Tests
      - name: swift build + swift test (contract tests over contracts/)
        working-directory: apps/macos
        run: |
          xcodebuild -version
          swift build
          swift test
      - name: Unsigned bundle (app + widget appex) + launch smoke
        working-directory: apps/macos
        run: |
          Bundle/bundle.sh --unsigned
          Bundle/smoke.sh
      # the App Store version (#186): the same binaries, sandboxed; it must still start (its data in its container)
      - name: Unsigned App Store version (sandboxed) + launch smoke
        working-directory: apps/macos
        run: |
          Bundle/bundle.sh --unsigned --app-store
          Bundle/smoke.sh

  # No PoC build jobs: poc/ is frozen (never edited; untouched since the monorepo began), so jobs that ran only when
  # poc/ changed never ran. Its Python reference still runs in `rules` (sync_crosscheck.py).

  gate:
    # The only required check. Passes only when every job either succeeded, or was skipped because `changes` said
    # it wasn't needed; a failed, cancelled or unexpectedly skipped job fails it.
    if: always()
    needs: [changes, rules, android, android-lint, android-release, android-play, mac]
    runs-on: ubuntu-latest
    steps:
      - name: Every job that should have run passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          out = needs.get("changes", {}).get("outputs", {})
          android = out.get("android") == "true"
          wanted = {"changes": True, "rules": out.get("rules") == "true", "android": android,
                    "android-lint": android, "android-release": android, "android-play": android,
                    "mac": out.get("mac") == "true"}
          bad = []
          for job, should in wanted.items():
              r = needs.get(job, {}).get("result")
              ok = r == "success" or (r == "skipped" and not should)
              print("%-15s %-9s %s" % (job, r, "ok" if ok else "FAILED"))
              if not ok:
                  bad.append(job)
          sys.exit(1 if bad else 0)
          PY
