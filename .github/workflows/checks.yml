# The repo's guards (CLAUDE.md → tools/check) plus every app's builds and tests over the shared contracts/.
# The trigger is never path-filtered (a skipped workflow leaves a required check pending forever): the `changes` job
# decides which jobs run (tools/ci/changes.py: what changed since the newest commit with a green run; nothing for a
# commit that already has one, e.g. main fast-forwarded to next's), and `gate` is the ONLY required check: it fails
# unless every job that should have run passed.
name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run every job, whatever changed
        type: boolean
        default: false
permissions:
  contents: read
# A pull request's newer push cancels its older run. Pushes never wait for or cancel each other: every pushed commit
# gets its own run at once (the release waits for its version commit's run, which must neither queue behind the run
# before it nor be cancelled by the one after); a later commit's run covers what an unfinished one changed (changes.py).
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# The Garmin face's fixed set of cases (SPEC.md §10): the safety states, one case per dial, always-on, private,
# Spanish. `garmin` runs it on the Descent Mk3i 43 mm inside the gate's timeout, `garmin-all` on every other watch of
# apps/garmin/aura/manifest.xml (the Descent there runs every case).
env:
  AURA_GATE_CASES: >-
    glucose-in-range,glucose-lo,glucose-hi,glucose-no-readings,glucose-old,alerts-very-low,
    alerts-extremely-high,alerts-muted-low,sensor-ended,sensor-phone-lost,modes-private,modes-spanish,
    dial-grain-ideal,dial-contours-ideal,dial-waterline-ideal,dial-lasers-ideal,dial-glow-ideal,
    dial-black-ideal,dial-map-ideal,aod-alerts-very-low,aod-glucose-hi

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      rules: ${{ steps.plan.outputs.rules }}
      android: ${{ steps.plan.outputs.android }}
      mac: ${{ steps.plan.outputs.mac }}
      website: ${{ steps.plan.outputs.website }}
      garmin: ${{ steps.plan.outputs.garmin }}
      range: ${{ steps.plan.outputs.range }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: What changed since the newest green commit
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FULL: ${{ inputs.full }}
        run: python3 tools/ci/changes.py >> "$GITHUB_OUTPUT"

  rules:
    needs: changes
    if: needs.changes.outputs.rules == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: tools/check/run.sh since the newest green commit (a PR's base)
        env:
          RANGE: ${{ needs.changes.outputs.range }}
        run: |
          echo "range: $RANGE"
          tools/check/run.sh --range "$RANGE"
      - name: The checks' own tests
        run: tools/check/run.sh --selftest
      - name: Which jobs a run needs (tools/ci/changes.py)
        run: python3 tools/ci/test_changes.py
      - name: The Garmin job's SDK setup without credentials (skips cleanly, offline)
        run: tools/ci/test_garmin_sdk.sh
      - name: Generated settings code is up to date
        run: python3 tools/settings/gen.py --check
      - name: The local test relay's tests (loopback only)
        run: python3 tools/relay/test_relay.py
      - name: The release command's tests (CHANGELOG, notes, version, store request bodies; no network, no keys)
        run: python3 tools/release/test_release.py
      # The independent Python reference (poc/spec/reference, frozen) with PROTOCOL-v2's rules: every sync sequence
      # gives the same verdicts and state as both apps, and the OGS vectors are its generator's bytes.
      - name: Protocol fixtures cross-checked against the reference follower
        run: python3 tools/protocol/sync_crosscheck.py
      - name: Scripts parse
        run: for f in tools/*.sh tools/*/*.sh; do bash -n "$f" || exit 1; done

  # `./gradlew check` runs as two jobs side by side: `android` is all of it but Android Lint (`check -x lint`: unit +
  # contract tests, spotlessCheck) plus Roborazzi verify, `android-lint` is `lint`; together exactly `check`'s tasks.
  # `android-release` and `android-play` build the release outputs meanwhile. Each starts from .github/actions/gradle
  # (Gradle's build cache from the newest run: only what a change touches runs again).
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/gradle
        with:
          cache: android-test
      - name: ./gradlew check -x lint (unit + contract tests, spotless) + Roborazzi verify
        working-directory: apps/android
        # No -x verifyReleaseSigning: `check` builds no release output (the release unit tests are off), so it must pass
        # without the owner's key; the guard on preReleaseBuild only stops real release builds.
        # Roborazzi verify only where goldens are committed (src/test/snapshots): :core:graph, :widgets, :monitor, :pen. They are
        # recorded on this same runner image by goldens.yml (Mac renders differ in text antialiasing and blending).
        # `check` includes spotlessCheck (ktlint + Compose rules + GPL header; QualityConventionPlugin).
        run: >-
          ./gradlew --no-daemon check -x lint
          :core:graph:verifyRoborazziDebug :widgets:verifyRoborazziDebug :monitor:verifyRoborazziDebug :pen:verifyRoborazziDebug
      # :feature:sharing's other screenshot tests are review galleries, never goldens: only the Share with someone goldens
      # (#170, its dark theme) are verified, by filtering the test task.
      - name: Roborazzi verify (Share with someone)
        working-directory: apps/android
        run: >-
          ./gradlew --no-daemon :feature:sharing:testDebugUnitTest --tests '*ShareScreenGoldenTest'
          -Proborazzi.test.verify=true
      # :feature:treatments likewise: only the Add treatment dialog's goldens (#181: the PoC's look, the lock-screen version)
      - name: Roborazzi verify (Add treatment dialog)
        working-directory: apps/android
        run: >-
          ./gradlew --no-daemon :feature:treatments:testDebugUnitTest --tests '*TreatmentDialogGoldenTest'
          -Proborazzi.test.verify=true
      # :feature:home likewise: only the treatment list's goldens (#207: its states, the Treatments page)
      - name: Roborazzi verify (treatment list)
        working-directory: apps/android
        run: >-
          ./gradlew --no-daemon :feature:home:testDebugUnitTest --tests '*TreatmentListGoldenTest'
          -Proborazzi.test.verify=true
      # Room exports each schema version while compiling; one the build changed but nobody committed would ship a
      # database that old installs can't open (tools/check room-schema keeps committed versions unchanged).
      - name: Room schemas the build exported are committed
        run: |
          git diff --exit-code -- 'apps/android/*/schemas' ||
            { echo "::error::Room schema changed by the build: bump @Database version, commit the new schema, add a migration"; exit 1; }
          test -z "$(git ls-files --others --exclude-standard -- 'apps/android/*/schemas')" ||
            { echo "::error::a new Room schema the build exported isn't committed"; exit 1; }
      - name: Roborazzi diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roborazzi-diffs
          path: apps/android/**/build/outputs/roborazzi
          if-no-files-found: ignore

  android-lint:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/gradle
        with:
          cache: android-lint
      - name: ./gradlew lint (check's Android Lint; errors and the curated warnings fail, QualityConventionPlugin)
        working-directory: apps/android
        run: ./gradlew --no-daemon lint

  android-release:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/gradle
        with:
          cache: android-release
      # The alert sounds are looked up by name, so only keep_alert_sounds.xml stops resource shrinking from removing
      # them (a silent alarm on release builds only). An unsigned release build is shrunk exactly like the signed one.
      - name: Alert sounds survive release resource shrinking
        working-directory: apps/android
        run: |
          # no Libre 3 core on CI (a separate checkout): skip its checks, the sounds are what this step verifies
          ./gradlew --no-daemon :app:assembleFullRelease -x verifyReleaseSigning -x verifyJuggluco -x verifyFullReleaseApkNativeCore
          ../../tools/release/verify-sounds.sh app/build/outputs/apk/full/release/app-full-release-unsigned.apk

  # The Google Play build (play flavor): the bundle builds and passes every check play-bundle.sh makes before an
  # upload except the signer and the Libre 3 core (no release key, no Juggluco checkout on CI): bundletool validate,
  # its universal APK through verify-apk.sh --play (permissions with play_permissions; the System UI module; no
  # update-check code).
  android-play:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/gradle
        with:
          cache: android-play
      - name: Play bundle, unsigned, checked
        run: tools/release/play-bundle.sh --unsigned

  mac:
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    # apps/macos builds against the macOS 27 SDK: the runner with Xcode 27.1, selected explicitly.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: swift format lint --strict (apps/macos/.swift-format)
        working-directory: apps/macos
        run: swift format lint --strict --recursive Sources Tests
      - name: swift build + swift test (contract tests over contracts/)
        working-directory: apps/macos
        run: |
          xcodebuild -version
          swift build
          swift test
      - name: Unsigned bundle (app + widget appex) + launch smoke
        working-directory: apps/macos
        run: |
          Bundle/bundle.sh --unsigned
          Bundle/smoke.sh
      # the App Store version (#186): the same binaries, sandboxed; it must still start (its data in its container)
      - name: Unsigned App Store version (sandboxed) + launch smoke
        working-directory: apps/macos
        run: |
          Bundle/bundle.sh --unsigned --app-store
          Bundle/smoke.sh

  # The website (website/, published by website.yml from main): built without the GitHub API (SUKRARA_RELEASE=offline:
  # a pull request never depends on it), then every internal link and anchor, every site URL an app opens, App Links,
  # universal links and the update feed checked (website/scripts/check.mjs), and the site's unit tests (npm test).
  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.node-version
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build and check
        working-directory: website
        env:
          SUKRARA_RELEASE: offline
        run: |
          npm ci
          npm run build
          npm run check
          npm test

  # The Garmin apps (apps/garmin; docs/DEVELOPMENT.md › Garmin face on CI). The SDK is public; the device files need a
  # Garmin sign-in: tools/ci/garmin-sdk.sh signs in as the dedicated CI account (secrets GARMIN_CI_USERNAME +
  # GARMIN_CI_PASSWORD, or GARMIN_CI_TOKEN) only when the cache lacks a device, and deletes the token before any of the
  # project's code runs. Without the files and a credential (before the owner adds them, forks, outside pull requests)
  # it writes ready=false with a notice: every later step is skipped and the job passes, so `gate` never fails for it.
  # Builds are signed with a key made for the run; the store key never comes here (release.py, on the release Mac).
  garmin:
    needs: changes
    if: needs.changes.outputs.garmin == 'true'
    runs-on: ubuntu-latest
    # The SDK's Linux simulator links WebKitGTK 4.0, which Ubuntu ships up to 22.04: that image, on the current runner.
    container: ubuntu:22.04
    timeout-minutes: 30
    outputs:
      devices: ${{ steps.sdk.outputs.devices-json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The SDK and the device files
        id: sdk
        uses: ./.github/actions/garmin
        with:
          username: ${{ secrets.GARMIN_CI_USERNAME }}
          password: ${{ secrets.GARMIN_CI_PASSWORD }}
          token: ${{ secrets.GARMIN_CI_TOKEN }}
      # No SDK needed: runs with or without the CI account
      - name: The face's words are words.json's
        if: hashFiles('apps/garmin/aura/tools/garmin_test.py') != ''
        run: python3 apps/garmin/aura/tools/garmin_test.py words
      - name: Release build (debug code compiled out)
        if: steps.sdk.outputs.ready == 'true'
        run: apps/garmin/build.sh aura release
      # Every watch of the manifest compiles (monkeyc builds each product; the simulator runs only the Descent here)
      - name: Store package (every watch)
        if: steps.sdk.outputs.ready == 'true'
        run: apps/garmin/build.sh aura export
      # The watch app and the data field (placeholder look, docs/47): a release build on the Descent, and the store
      # package, which compiles every product of their manifests (73 watches, every screen class)
      - name: Sukrara (watch app) and Sukrara data field, release and store package (every watch)
        if: steps.sdk.outputs.ready == 'true'
        run: |
          for app in app field; do
            apps/garmin/build.sh "$app" release
            apps/garmin/build.sh "$app" export
          done
      # The developer page's sample face (sukrara.mauri.app/developers/garmin-faces/), so the example there still compiles
      - name: The sample face that reads Sukrara
        if: steps.sdk.outputs.ready == 'true'
        run: apps/garmin/build.sh sample release
      # SPEC.md §10 on a fixed set of cases, so the gate stays inside its timeout (the full set takes 1–2 h: garmin-all):
      # the safety states, one case per dial, always-on, private, Spanish. Their numbers against expect.json (fails the
      # job), the battery label against every row, a screenshot of each diffed with docs/img/aura/ref (the artifact).
      - name: The face's tests in the simulator (a fixed set of cases)
        if: steps.sdk.outputs.ready == 'true'
        env:
          AURA_CASES: ${{ env.AURA_GATE_CASES }}
        run: |
          AURA_CASES="$(echo "$AURA_CASES" | tr -d ' ')"
          export AURA_CASES
          xvfb-run -a -s "-screen 0 1280x1024x24" python3 apps/garmin/aura/tools/garmin_test.py run "$RUNNER_TEMP/garmin-test"
      - name: The face's screenshots and diff images
        if: always() && steps.sdk.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: garmin-test
          path: ${{ runner.temp }}/garmin-test
          if-no-files-found: ignore

  # The face on every watch of apps/garmin/aura/manifest.xml (a matrix, one job per watch): the Descent Mk3i 43 mm every case
  # (1–2 h: heavy dial cases make monkeydo lose the simulator, and the harness restarts it), the others the gate's fixed
  # set (same 390 × 390 pictures). Only on `workflow_dispatch` with full=true, and outside `gate`: its result is the
  # run's, not a release's. Starts after `garmin`, which keeps the SDK and the device files in the cache.
  garmin-all:
    needs: garmin
    if: github.event_name == 'workflow_dispatch' && inputs.full && needs.garmin.result == 'success' && needs.garmin.outputs.devices != ''
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.garmin.outputs.devices) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The SDK and the device files
        id: sdk
        uses: ./.github/actions/garmin
        with:
          username: ${{ secrets.GARMIN_CI_USERNAME }}
          password: ${{ secrets.GARMIN_CI_PASSWORD }}
          token: ${{ secrets.GARMIN_CI_TOKEN }}
      - name: The face's tests in the simulator (${{ matrix.device }})
        if: steps.sdk.outputs.ready == 'true'
        env:
          CIQ_DEVICE: ${{ matrix.device }}
          AURA_CASES: ${{ matrix.device != 'descentmk343mm' && env.AURA_GATE_CASES || '' }}
        run: |
          AURA_CASES="$(echo "$AURA_CASES" | tr -d ' ')"
          if [ -n "$AURA_CASES" ]; then export AURA_CASES; else unset AURA_CASES; fi
          xvfb-run -a -s "-screen 0 1280x1024x24" python3 apps/garmin/aura/tools/garmin_test.py run "$RUNNER_TEMP/garmin-test"
      - name: The face's screenshots and diff images
        if: always() && steps.sdk.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: garmin-test-all-${{ matrix.device }}
          path: ${{ runner.temp }}/garmin-test
          if-no-files-found: ignore

  # No PoC build jobs: poc/ is frozen (never edited; untouched since the monorepo began), so jobs that ran only when
  # poc/ changed never ran. Its Python reference still runs in `rules` (sync_crosscheck.py).

  gate:
    # The only required check. Passes only when every job either succeeded, or was skipped because `changes` said
    # it wasn't needed; a failed, cancelled or unexpectedly skipped job fails it.
    if: always()
    needs: [changes, rules, android, android-lint, android-release, android-play, mac, website, garmin]
    runs-on: ubuntu-latest
    steps:
      - name: Every job that should have run passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          out = needs.get("changes", {}).get("outputs", {})
          android = out.get("android") == "true"
          wanted = {"changes": True, "rules": out.get("rules") == "true", "android": android,
                    "android-lint": android, "android-release": android, "android-play": android,
                    "mac": out.get("mac") == "true", "website": out.get("website") == "true",
                    "garmin": out.get("garmin") == "true"}
          bad = []
          for job, should in wanted.items():
              r = needs.get(job, {}).get("result")
              ok = r == "success" or (r == "skipped" and not should)
              print("%-15s %-9s %s" % (job, r, "ok" if ok else "FAILED"))
              if not ok:
                  bad.append(job)
          sys.exit(1 if bad else 0)
          PY
