# The website (sukrara.mauri.app): website/ (Astro + Starlight) built and checked, then published on GitHub Pages.
# From main on every push, and again whenever a release is published, so the download buttons name and link the newest
# release (website/src/lib/release.ts reads it at build time). tools/release/release.py waits for this workflow's run on
# main before it checks the Sparkle feed (website/public/appcast.xml → /appcast.xml).
name: Website
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history without file contents: "Last updated" comes from each page's last commit.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.node-version
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - name: Build (the newest release from the GitHub API)
        run: npm run build
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check links, the apps' URLs, App Links and the update feed
        run: npm run check
        working-directory: website
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist
          # /.well-known (apple-app-site-association: Mac universal links; assetlinks.json: Android App Links) is a
          # hidden folder, which the artifact leaves out by default (both answered 404 after the 0.12.0 deploy)
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
