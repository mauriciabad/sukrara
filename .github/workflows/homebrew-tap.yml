# Keeps the Homebrew cask (github.com/mauriciabad/homebrew-tap, Casks/sukrara.rb) on the current release: when a
# release is published, read the version from its tag (v0.12.0 → 0.12.0), hash its Sukrara-<version>.dmg and commit
# the new version + sha256 to the tap. Every release is a normal GitHub release (CLAUDE.md) and the cask follows them;
# a GitHub prerelease (a release candidate, if one is ever published) is skipped, also when dispatched by hand, like
# the apps' own update checks skip it. Only *published* triggers it: switching an existing prerelease to a release
# (`released` / `edited`) doesn't; dispatch it by hand if the cask should take that one. Pushes with the tap's deploy key (write
# access to that repo only), stored here as the secret HOMEBREW_TAP_DEPLOY_KEY. Re-run by hand with workflow_dispatch
# (tag) if a release was edited. The cask also gets `auto_updates true` (the app updates itself with Sparkle, #91);
# don't dispatch it for a release older than the updater (0.13.0 and before), which brew would then never upgrade.
name: Homebrew tap
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.11.14)
        required: true
permissions:
  contents: read
concurrency:
  group: homebrew-tap
  cancel-in-progress: false
jobs:
  bump:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Hash the release dmg
        id: dmg
        run: |
          # A prerelease (a release candidate) never reaches the cask; the job condition skips a published one,
          # this also refuses one dispatched by hand.
          if [ "$(gh release view "$TAG" -R "${{ github.repository }}" --json isPrerelease --jq .isPrerelease)" = true ]; then
            echo "::error::$TAG is a release candidate (a GitHub prerelease): the cask only follows releases"; exit 1
          fi
          VER="${TAG#v}"
          gh release download "$TAG" -R "${{ github.repository }}" -p "Sukrara-$VER.dmg" -D dl
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "dl/Sukrara-$VER.dmg" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mauriciabad/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Commit the new version to the tap
        working-directory: tap
        env:
          VER: ${{ steps.dmg.outputs.version }}
          SHA: ${{ steps.dmg.outputs.sha256 }}
        run: |
          sed -i -E "s/^  version \".*\"/  version \"$VER\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/sukrara.rb
          grep -q "version \"$VER\"" Casks/sukrara.rb && grep -q "sha256 \"$SHA\"" Casks/sukrara.rb
          # Releases from this workflow's version on update themselves with Sparkle (#91): `auto_updates true` makes
          # `brew upgrade` leave them to it. Added with the first such release, so 0.13.0 (no updater) still upgrades.
          if ! grep -q '^  auto_updates true$' Casks/sukrara.rb; then
            awk '/^  depends_on arch:/ && !done { print "  auto_updates true"; done = 1 } { print }' Casks/sukrara.rb > cask.new
            mv cask.new Casks/sukrara.rb
            grep -q '^  auto_updates true$' Casks/sukrara.rb
          fi
          if git diff --quiet; then echo "cask already at $VER"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "sukrara $VER" -m "From ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
          git push
