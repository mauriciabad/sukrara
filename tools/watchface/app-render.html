<!-- Sukrara on Garmin: one screen from the reference (app.js) at 1:1. app-render.html#cfg=<url-encoded JSON>: cls (the
     screen class, SPEC §14), screen and the scenario, or {"watch": <the watch's input, as its case loader prints it>}
     to draw what the watch drew (app-input.js, on black like the simulator's screenshot); #sheet=<url-encoded JSON> draws a contact sheet instead
     ({title, sub, items: [{id, cfg}]}). Used by app-build.mjs (the PNGs) and apps/garmin/app/tools/app_test.py. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sukrara on Garmin · reference render</title>
<style>
  @font-face { font-family: 'Atkinson Hyperlegible Next'; src: url('../../apps/garmin/fonts/AtkinsonHyperlegibleNext-wght.ttf') format('truetype'); font-weight: 200 800; font-display: block; }
  html, body { margin: 0; background: transparent; }
  body.watch { background: #000; }
  svg { display: block; }
  body.sheet { background: #2E2E34; color: #C8C8CC; font: 13px/1.35 system-ui, sans-serif; padding: 20px; }
  h1 { font-size: 20px; margin: 0 0 4px; color: #FFF; }
  .sub { margin: 0 0 18px; color: #9A9AA0; max-width: 1400px; }
  .grid { display: flex; flex-wrap: wrap; gap: 18px 16px; align-items: flex-end; }
  figure { margin: 0; }
  figcaption { margin-top: 6px; font-size: 12px; color: #B0B0B5; max-width: 480px; }
</style>
<script src="app.js"></script>
<script src="app-input.js"></script>
</head>
<body>
<div id="out"></div>
<script>
  const params = new URLSearchParams(location.hash.slice(1));
  const cfgOf = (c) => {
    if (!c.watch) return c;
    document.body.className = 'watch';
    const w = AppInput.fromWatch(c.watch);
    return Object.assign(w.cfg, { input: w.input }, c.extra || {});
  };
  const draw = () => {
    if (params.get('sheet')) {
      const sh = JSON.parse(params.get('sheet'));
      document.body.className = 'sheet';
      document.getElementById('out').innerHTML = '<h1>' + sh.title + '</h1><p class="sub">' + sh.sub + '</p><div class="grid">' +
        sh.items.map((it) => '<figure>' + WL.svg(cfgOf(it.cfg)) + '<figcaption>' + it.id + '</figcaption></figure>').join('') + '</div>';
    } else {
      document.getElementById('out').innerHTML = WL.svg(cfgOf(JSON.parse(params.get('cfg') || '{}')));
    }
  };
  draw();
  document.fonts.load("700 20px 'Atkinson Hyperlegible Next'").then(draw);
</script>
</body>
</html>
